name: repro

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.os }} / onnxruntime ${{ matrix.ort }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ort: ["1.31.1", "nightly"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q onnx==1.23.2 numpy==2.5.4
          if [ "${{ matrix.ort }}" = nightly ]; then
            python -m pip install -q --pre --index-url \
              https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/pypi/simple/ onnxruntime
          else
            python -m pip install -q "onnxruntime==${{ matrix.ort }}"
          fi
      - name: CPU
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E 'Model name|Flags' | sed -E 's/(Flags:).*/\1 '"$(grep -o -w -E 'avx[0-9a-z_]*|fma|f16c|amx[a-z_]*' /proc/cpuinfo | sort -u | tr '\n' ' ')"'/' ;;
            macOS) sysctl -n machdep.cpu.brand_string; uname -m ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
          esac
      - name: Repro (exit 1 = mismatch, exit 2 = inconclusive)
        run: |
          set +e
          python repro_33677.py --sweep 2>&1 | tee result.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > rc.txt
          exit "$rc"
      - name: Summary
        if: always()
        run: |
          RC=$(cat rc.txt 2>/dev/null)
          case "$RC" in
            0) verdict="all match, prepacked blobs consumed" ;;
            1) verdict="MISMATCH: bug reproduced (exit 1)" ;;
            2) verdict="INCONCLUSIVE: a prepacked blob on disk was not consumed (exit 2)" ;;
            *) verdict="ERROR: repro did not finish (exit ${RC:-none})" ;;
          esac
          {
            echo "### ${{ matrix.os }} / onnxruntime ${{ matrix.ort }}: $verdict"
            echo '```'
            cat result.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
